<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<title>CODING MASTERS | ANPR FORENSICS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

{% load static %}

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        body { font-family: 'Rajdhani', sans-serif; }
        .cyber-font { font-family: 'Orbitron', sans-serif; }


        /* Laser Animation */
        .scanner-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80, 0 0 20px #4ade80;
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .neon-border { box-shadow: 0 0 5px rgba(74, 222, 128, 0.3); }
        .slide-in { animation: slideIn 0.5s ease-out; }
        @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Make vehicle icons look clean */
        .vehicle-icon {
            background: transparent !important;
            border: none !important;
            filter: drop-shadow(0 0 3px rgba(34, 197, 94, 0.7));
        }


        #map { height:100%; }


        .blink-yellow {
    animation: blinkPulse 1s infinite;
}

    @keyframes blinkPulse {
        0%   { filter: drop-shadow(0 0 2px #fde047); opacity: 1; }
        50%  { filter: drop-shadow(0 0 10px #fde047); opacity: 0.4; }
        100% { filter: drop-shadow(0 0 2px #fde047); opacity: 1; }
    }

    </style>
</head>
<body class="text-slate-200 h-screen flex flex-col bg-slate-900 overflow-hidden">

    <!-- HEADER -->
<header class="h-16 bg-slate-900 border-b border-slate-700 flex items-center justify-between px-6 shadow-lg z-10">

    <div class="flex items-center gap-3">
        <i class="fas fa-video text-green-400 text-xl"></i>
        <h1 class="cyber-font text-xl font-bold tracking-wider text-white">
            <span class="text-green-400">CODING</span>MASTERS
        </h1>
    </div>

    {% include "partials/navbar.html" %}

</header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 grid grid-cols-12 gap-4 p-4 min-h-0">
        <!-- LEFT: Filters -->
        <div class="col-span-3 bg-slate-800 rounded-lg p-4 border border-slate-700">
            <h2 class="cyber-font text-green-400 text-lg mb-4">SEARCH VEHICLE</h2>
            <form id="search-form" class="space-y-4">
                <input type="text" name="plate_search" id="plate-search" placeholder="Plate (e.g. DL01*)" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-white">
                <input type="datetime-local" name="start_time" id="start-time" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-white">
                <input type="datetime-local" name="end_time" id="end-time" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-white">
                <select name="color_filter" id="color-filter" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-white">
                    <option value="">Color</option>
                    <option value="Beige">Beige</option>
                    <option value="Black">Black</option>
                    <option value="Blue">Blue</option>
                    <option value="Brown">Brown</option>
                    <option value="Gold">Gold</option>
                    <option value="Green">Green</option>
                    <option value="Grey">Grey</option>
                    <option value="Orange">Orange</option>
                    <option value="Pink">Pink</option>
                    <option value="Purple">Purple</option>
                    <option value="Red">Red</option>
                    <option value="Silver">Silver</option>
                    <option value="Tan">Tan</option>
                    <option value="White">White</option>
                    <option value="Yellow">Yellow</option>
                </select>
                <select name="type_filter" id="type-filter" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-white">
                    <option value="">Type</option>
                    <option value="Car">Car</option>
                    <option value="Motorcycle">Motorcycle</option>
                    <option value="Bus">Bus</option>
                    <option value="Truck">Truck</option>
                </select>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white p-2 rounded transition">
                    SEARCH
                </button>
            </form>
        </div>

        <!-- CENTER: Map -->
        <div class="col-span-6 bg-slate-800 rounded-lg border border-slate-700 overflow-hidden">
            <div id="map" class="h-full"></div>
        </div>

        <!-- RIGHT: History List -->
        <div class="col-span-3 bg-slate-800 rounded-lg p-4 border border-slate-700 flex flex-col min-h-0">
            <h2 class="cyber-font text-green-400 text-lg mb-4">SIGHTING HISTORY</h2>

            <div id="history-list"
                class="flex-1 overflow-y-auto space-y-3 pr-1">
            </div>

            <button id="export-pdf"
                class="mt-4 bg-red-600 hover:bg-red-500 text-white p-2 rounded transition">
                EXPORT EVIDENCE PDF
            </button>
        </div>
    </main>

    <!-- JavaScript -->
    <script>

        const CAMERA_LOCATIONS = {
            "CAM_01_TOLL_GATE": "Toll Gate",
            "CAM_02_HIGHWAY": "National Highway",
            "CAM_03_MARKET": "City Market",
            "CAM_04_CITY": "Downtown",
            "CAM_05_TUNNEL": "River Tunnel",
            "CAM_06_BORDER": "State Border"
        };

        let CURRENT_SIGHTINGS = [];

        // Clock
        setInterval(() => {
            const el = document.getElementById('clock');
            if (el) el.innerText = new Date().toLocaleTimeString();
        }, 1000);

        // Map
        const map = L.map('map').setView([16.3067, 80.4365], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);
        let currentLayer = L.layerGroup().addTo(map);

        // Vehicle Icons (small, aesthetic, different colors)
function getVehicleIcon(type){
            return L.divIcon({
                className: 'vehicle-icon',
                // Added a slight white shadow so the black icon stands out on the map
                html: `<i class="fas fa-car" style="color: #000000; font-size: 18px; filter: drop-shadow(0px 0px 2px rgba(255,255,255,0.8));"></i>`,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
        }

        // Load all vehicles on page open
        window.addEventListener('load', () => {
            console.log("Loading all vehicles...");
            fetch('/api/search/')
                .then(r => {
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    return r.json();
                })
                .then(data => {
                    console.log("All vehicles loaded:", data);
                    updateMapAndHistory(data);
                })
                .catch(err => {
                    console.error("Failed to load all vehicles:", err);
                    document.getElementById('history-list').innerHTML = 
                        '<p class="text-red-400 text-center py-6">Error loading data</p>';
                }
                );
        });

        // Handle form submit (filters)
        document.getElementById('search-form').addEventListener('submit', e => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const params = new URLSearchParams(formData);

            console.log("Applying filters:", params.toString());

            fetch(`/api/search/?${params}`)
                .then(r => r.json())
                .then(data => {
                    console.log("Filtered data:", data);
                    updateMapAndHistory(data);
                })
                .catch(err => console.error("Filter failed:", err));
        });


function getLatestVehicleIcon(type){
            return L.divIcon({
                className: 'vehicle-icon blink-yellow',
                // Black shadow to make the yellow pop
                html: `<i class="fas fa-car" style="color: #fde047; font-size: 24px; filter: drop-shadow(0px 0px 3px rgba(0,0,0,0.8));"></i>`,
                iconSize: [26, 26],
                iconAnchor: [13, 13]
            });
        }


        // Render function
// Render function
        function updateMapAndHistory(data, mode = "all") {
            CURRENT_SIGHTINGS = data.sightings || [];
            currentLayer.clearLayers();

            const list = document.getElementById('history-list');
            list.innerHTML = '';

            if (!data.sightings || !data.sightings.length) {
                list.innerHTML = '<p class="text-slate-500 text-center py-6">No sightings found</p>';
                if (window.currentRoute) map.removeControl(window.currentRoute);
                return;
            }

            let coords = [];
            const uniquePlates = new Set();
            const latestPerVehicle = {};

            // ---------- find latest timestamp per vehicle ----------
            data.sightings.forEach(s => {
                const plate = s.vehicle__plate_number;
                uniquePlates.add(plate);
                
                // Use .getTime() to get a reliable numeric value for comparison
                const t = new Date(s.timestamp).getTime(); 
                if (!latestPerVehicle[plate] || t > latestPerVehicle[plate]) {
                    latestPerVehicle[plate] = t;
                }
            });

            // ---------- render markers + history ----------
            data.sightings.forEach(s => {
                if (s.lat != null && s.lon != null) {
                    const lat = parseFloat(s.lat);
                    const lon = parseFloat(s.lon);
                    const time = new Date(s.timestamp);
                    const plate = s.vehicle__plate_number;

                    coords.push({ lat: lat, lon: lon, time: time });

                    const offsetLat = lat + (Math.random() - 0.5) * 0.0005;
                    const offsetLon = lon + (Math.random() - 0.5) * 0.0005;

                    // Safely compare the exact numeric timestamps
                    const isLatest = time.getTime() === latestPerVehicle[plate];

                    const icon = isLatest
                        ? getLatestVehicleIcon(s.vehicle__predicted_type)
                        : getVehicleIcon(s.vehicle__predicted_type);

                    L.marker([offsetLat, offsetLon], { icon })
                        .addTo(currentLayer)
                        .bindPopup(`
                            <div class="text-sm min-w-[220px]">
                                <div class="font-bold text-green-400 mb-1">${plate}</div>
                                <div><b>Time:</b> ${time.toLocaleString()}</div>
                                <div><b>Camera:</b> ${CAMERA_LOCATIONS[s.camera_id] || s.camera_id}</div>
                                <div><b>Type:</b> ${s.vehicle__predicted_type || '—'}</div>
                                <div><b>Color:</b> ${s.vehicle__predicted_color || '—'}</div>
                                <div><b>Confidence:</b> ${s.confidence ? Number(s.confidence).toFixed(1) : '—'}%</div>
                                <div><b>Weather:</b> ${s.weather_condition || 'Clear'}</div>
                                <button onclick="trackVehicle('${plate}')"
                                    class="mt-3 w-full bg-green-600 hover:bg-green-500 text-white text-xs py-1.5 rounded transition">
                                    Track Full Route
                                </button>
                            </div>
                        `);
                }

                // history panel with full data
                const camName = CAMERA_LOCATIONS[s.camera_id] || s.camera_id;
                const conf = s.confidence ? Number(s.confidence).toFixed(1) + '%' : 'N/A';
                const timeStr = (new Date(s.timestamp || Date.now())).toLocaleString();
                const type = s.vehicle__predicted_type || 'Unknown';
                const color = s.vehicle__predicted_color || 'Unknown';
                const weather = s.weather_condition || 'Clear';

                const clickAction = (s.lat != null && s.lon != null) 
                    ? `trackVehicle('${s.vehicle__plate_number}', ${s.lat}, ${s.lon})`
                    : `trackVehicle('${s.vehicle__plate_number}')`;

                list.innerHTML += `
                <div onclick="${clickAction}" class="bg-slate-900 p-3 rounded mb-3 text-sm border-l-4 border-green-500 cursor-pointer hover:bg-slate-800 transition shadow-md">
                    <div class="flex justify-between items-start mb-2">
                        <div class="font-bold text-green-400 text-base tracking-wider">${s.vehicle__plate_number}</div>
                        <div class="text-xs bg-slate-800 px-2 py-1 rounded text-green-300 font-mono">${conf}</div>
                    </div>
                    <div class="text-slate-300 space-y-1.5">
                        <div class="flex items-center gap-2"><i class="far fa-clock w-4 text-slate-400 text-center"></i><span>${timeStr}</span></div>
                        <div class="flex items-center gap-2"><i class="fas fa-video w-4 text-slate-400 text-center"></i><span>${camName}</span></div>
                        <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-700 mt-1">
                            <div class="flex items-center gap-2"><i class="fas fa-car w-4 text-slate-400 text-center"></i><span>${type}</span></div>
                            <div class="flex items-center gap-2"><i class="fas fa-palette w-4 text-slate-400 text-center"></i><span>${color}</span></div>
                            <div class="flex items-center gap-2 col-span-2"><i class="fas fa-cloud-sun w-4 text-slate-400 text-center"></i><span>${weather}</span></div>
                        </div>
                    </div>
                </div>`;
            });

            // ---------- route drawing ----------
            if (window.currentRoute) {
                map.removeControl(window.currentRoute);
                window.currentRoute = null;
            }

            // Only draw a route if the map is currently showing EXACTLY ONE vehicle.
            if (uniquePlates.size === 1 && coords.length >= 2) {
                coords.sort((a, b) => a.time - b.time);
                
                // Prevent loops by ensuring we only route between distinctly different coordinates
                const distinctRouteCoords = [];
                coords.forEach(c => {
                    if (distinctRouteCoords.length === 0) {
                        distinctRouteCoords.push([c.lat, c.lon]);
                    } else {
                        const prev = distinctRouteCoords[distinctRouteCoords.length - 1];
                        if (prev[0] !== c.lat || prev[1] !== c.lon) {
                            distinctRouteCoords.push([c.lat, c.lon]);
                        }
                    }
                });

                if (distinctRouteCoords.length >= 2) {
                    window.currentRoute = L.Routing.control({
                        router: L.Routing.osrmv1({ serviceUrl: "https://router.project-osrm.org/route/v1" }),
                        waypoints: distinctRouteCoords.map(c => L.latLng(c[0], c[1])),
                        routeWhileDragging: false, draggableWaypoints: false, addWaypoints: false,
                        createMarker: () => null, show: false,
                        lineOptions: { styles: [{ color: "#22c55e", weight: 4 }] }
                    }).addTo(map);

                    if (mode === "track") {
                        map.fitBounds(L.latLngBounds(distinctRouteCoords), { padding: [80, 80] });
                    }
                }
            } else if (coords.length === 1 && mode === "track") {
                map.setView([coords[0].lat, coords[0].lon], 16);
            }
        }
        // Track full route (always complete history)
 // Track full route (always complete history)
// Track full route (always complete history)
        function trackVehicle(plate, targetLat, targetLon) {
            fetch(`/api/search/?plate_search=${encodeURIComponent(plate)}`)
                .then(r => r.json())
                .then(data => {
                    currentLayer.clearLayers();

                    if (!data.sightings || !data.sightings.length) return;

                    let coords = [];

                    // ---- find latest timestamp ----
                    let latestTime = null;
                    data.sightings.forEach(s => {
                        const t = new Date(s.timestamp).getTime();
                        if (!latestTime || t > latestTime) latestTime = t;
                    });

                    // ---- render markers ----
                    data.sightings.forEach(s => {
                        if (s.lat != null && s.lon != null) {
                            const lat = parseFloat(s.lat);
                            const lon = parseFloat(s.lon);
                            const time = new Date(s.timestamp);

                            coords.push({ lat: lat, lon: lon, time: time });

                            const isLatest = time.getTime() === latestTime;
                            const icon = isLatest
                                ? getLatestVehicleIcon(s.vehicle__predicted_type)
                                : getVehicleIcon(s.vehicle__predicted_type);

                            L.marker([lat, lon], { icon })
                                .addTo(currentLayer)
                                .bindPopup(`
                                    <div class="text-sm min-w-[200px]">
                                        <div class="font-bold text-green-400">${s.vehicle__plate_number}</div>
                                        <div><b>Time:</b> ${time.toLocaleString()}</div>
                                        <div><b>Camera:</b> ${CAMERA_LOCATIONS[s.camera_id] || s.camera_id}</div>
                                        <div><b>Type:</b> ${s.vehicle__predicted_type || '—'}</div>
                                        <div><b>Color:</b> ${s.vehicle__predicted_color || '—'}</div>
                                        <button onclick="trackVehicle('${s.vehicle__plate_number}', ${lat}, ${lon})"
                                            class="mt-3 w-full bg-green-600 hover:bg-green-500 text-white text-xs py-1.5 rounded transition">
                                            Track Full Route
                                        </button>
                                    </div>
                                `);
                        }
                    });

                    // ---- route ----
                    if (window.currentRoute) {
                        map.removeControl(window.currentRoute);
                        window.currentRoute = null;
                    }

                    if (coords.length >= 2) {
                        coords.sort((a, b) => a.time - b.time);
                        
                        const distinctRouteCoords = [];
                        coords.forEach(c => {
                            if (distinctRouteCoords.length === 0) {
                                distinctRouteCoords.push([c.lat, c.lon]);
                            } else {
                                const prev = distinctRouteCoords[distinctRouteCoords.length - 1];
                                if (prev[0] !== c.lat || prev[1] !== c.lon) {
                                    distinctRouteCoords.push([c.lat, c.lon]);
                                }
                            }
                        });

                        if (distinctRouteCoords.length >= 2) {
                            window.currentRoute = L.Routing.control({
                                router: L.Routing.osrmv1({ serviceUrl: "https://router.project-osrm.org/route/v1" }),
                                waypoints: distinctRouteCoords.map(c => L.latLng(c[0], c[1])),
                                routeWhileDragging: false, draggableWaypoints: false, addWaypoints: false,
                                createMarker: () => null, show: false,
                                lineOptions: { styles: [{ color: "#22c55e", weight: 4 }] }
                            }).addTo(map);
                        }
                    }

                    // ---- Map Panning Logic ----
                    if (targetLat != null && targetLon != null) {
                        map.setView([targetLat, targetLon], 16);
                    } else if (coords.length >= 2) {
                        const routeCoords = coords.map(c => [c.lat, c.lon]);
                        map.fitBounds(L.latLngBounds(routeCoords), { padding: [80, 80] });
                    } else if (coords.length === 1) {
                        map.setView([coords[0].lat, coords[0].lon], 16);
                    }
                });
        }
        // PDF Export
      document.getElementById('export-pdf').addEventListener('click', () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        // ===== HEADER =====
        doc.setFontSize(16);
        doc.text("ANPR FORENSIC REPORT", 105, 15, { align: "center" });

        doc.setFontSize(10);
        doc.text("Generated: " + new Date().toLocaleString(), 105, 22, { align: "center" });

        doc.setFontSize(12);
        doc.text("Total Sightings: " + CURRENT_SIGHTINGS.length, 14, 32);

        let y = 40;

        if (!CURRENT_SIGHTINGS.length) {
            doc.text("No sightings found for current filter.", 14, y);
            doc.save("anpr-forensic-evidence.pdf");
            return;
        }

        // ===== TABLE HEADER =====
        doc.setFontSize(11);
        doc.text("Plate", 14, y);
        doc.text("Time", 50, y);
        doc.text("Camera", 110, y);
        doc.text("Type", 150, y);

        y += 6;

        // ===== ROWS =====
        doc.setFontSize(9);

        CURRENT_SIGHTINGS.forEach(s => {
            if (y > 280) {
                doc.addPage();
                y = 20;
            }

            const time = (new Date(s.timestamp || Date.now())).toLocaleString();

            doc.text(String(s.vehicle__plate_number || "-"), 14, y);
            doc.text(time, 50, y);
            doc.text(String(s.camera_id || "-"), 110, y);
            doc.text(String(s.vehicle__predicted_type || "-"), 150, y);

            y += 6;
        });

        // ===== SAVE =====
        doc.save("anpr-forensic-evidence.pdf");
    });



    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
</html>
